<style>

    --gold:#D89A3E; --cream:#F0F8FB; --muted:#7C97A3; --line:#D6E9F0;

  *{box-sizing:border-box;}
  body{margin:0; background:#DCEEF5; font-family:'Inter',sans-serif; display:flex; justify-content:center; padding:24px 12px;}
  .app{background:var(--cream); width:100%; max-width:420px; border-radius:16px; overflow:hidden; border:1px solid var(--line); box-shadow:0 12px 30px rgba(46,110,142,0.15);}

  .toggle{cursor:pointer; width:34px; height:18px; border-radius:20px; background:#3D8FB8; position:relative; flex-shrink:0; transition:background 0.15s;}

  .toggle-dot{position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left 0.15s;}
  .toggle.on .toggle-dot{left:18px;}
  .content{padding:16px; min-height:420px;}
  .chip{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:20px; font-size:12px; cursor:pointer; border:1px solid var(--line); background:#fff; color:#4A6673; user-select:none;}
  .chip.active{background:var(--green); color:var(--green-deep); border-color:var(--green);}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .card-left{display:flex; gap:8px;}
  .pin{color:var(--muted); margin-top:2px; flex-shrink:0;}
  .card-address{margin:0; font-size:14px; font-weight:600; color:var(--sky-deep);}
  .card-owner{margin:2px 0 0; font-size:12px; color:var(--muted);}

  .b-instant{font-size:11px; background:var(--green); color:var(--green-deep); padding:3px 8px; border-radius:20px; font-weight:600;}

<script>
const SUPABASE_URL = "https://meawvaorrillebhkxgew.supabase.co";
const SUPABASE_KEY = "sb_publishable_w7csw-kv0LdflWDPikkp3Q_NcbqESfM";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function mapUser(u){
  if (!u) return null;
  return { id: u.id, email: u.email, displayName: (u.user_metadata && u.user_metadata.display_name) || u.email.split('@')[0] };
}

async function signUp(email, password, displayName){
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { display_name: displayName } } });
  return { user: data && data.user ? mapUser(data.user) : null, error };
}

async function signIn(email, password){
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  return { user: data && data.user ? mapUser(data.user) : null, error };
}

async function signOutUser(){
  await sb.auth.signOut();
  state.user = null;
  state.profile = null;
  render();
}

async function ensureProfile(user){
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (data) return data;
  const { data: created, error } = await sb.from('profiles').insert({ id: user.id, display_name: user.displayName }).select().maybeSingle();
  if (error){ console.error(error); return null; }
  return created;
}

async function fetchProfilesMap(){
  const { data, error } = await sb.from('profiles').select('id, verified');
  if (error){ console.error(error); return {}; }
  const map = {};
  data.forEach(p => { map[p.id] = p.verified; });
  return map;
}

async function submitVerificationPhoto(userId, photoDataUrl){
  const { data, error } = await sb.from('profiles').update({ id_photo: photoDataUrl, submitted_for_verification: true }).eq('id', userId).select().maybeSingle();
  if (error){ console.error(error); showToast('Hindi na-submit, subukan ulit'); return null; }
  return data;
}
</script>

function resizeImage(file, maxWidth){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

  const { data, error } = await sb.from('bookings').insert(bookingToRow(booking)).select();

  return rowToBooking(data[0]);
}

async function deleteBookingRow(id){
  const { error } = await sb.from('bookings').delete().eq('id', id);
  if (error){ console.error(error); showToast('Hindi ma-cancel, subukan ulit'); return false; }
  return true;
}

async function updateBookingRating(id, rating){
  const { error } = await sb.from('bookings').update({ rating }).eq('id', id);
  if (error){ console.error(error); showToast('Hindi na-save ang rating'); return false; }
  return true;
}

function toRad(v){ return v * Math.PI / 180; }
function distanceKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

window.__lightboxNav = function(dir){

};

function renderAccountRow(){

  if (!row) return;
  if (state.user){
    row.innerHTML = `<span class="account-label">Hi, ${state.user.displayName}</span><button class="account-btn" id="logoutBtn">Logout</button>`;

function render(){
  const content = document.getElementById('content');
  if (state.loading){
    content.innerHTML = '<p class="empty">Loading...</p>';
    renderAccountRow();
    return;
  }
  if (state.tab === 'search') content.innerHTML = renderSearch();
  else if (state.tab === 'list') content.innerHTML = state.user ? renderListForm() : loginRequiredBlock('makapag-list ng space');
  else content.innerHTML = state.user ? renderBookings() : loginRequiredBlock('makita ang mga booking mo');

  if (state.tab === 'search') setTimeout(initSearchMap, 0);
  if (state.tab === 'list' && state.user) setTimeout(initFormMap, 0);

  document.querySelectorAll('.nav button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === state.tab);
  });

  const ft = document.getElementById('fiestaToggle');
  ft.classList.toggle('on', state.fiestaMode);

  renderAccountRow();
  attachContentListeners();
}

function attachContentListeners(){
  document.querySelectorAll('[data-filter]').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.filter;
      state.activeFilters = state.activeFilters.includes(id)
        ? state.activeFilters.filter(x => x !== id)
        : [...state.activeFilters, id];
      render();
    };
  });

  document.querySelectorAll('[data-book]').forEach(el => {
    el.onclick = () => {
      if (!state.user){
        state.pendingAction = { type: 'book', listingId: el.dataset.book };
        openAuthModal();
        return;
      }
      openBooking(el.dataset.book);
    };
  });

  document.querySelectorAll('[data-formfeat]').forEach(el => {
    el.onclick = () => { el.classList.toggle('active'); };
  });

  const findNear = document.getElementById('findNearMe');
  if (findNear) findNear.onclick = () => {
    if (!navigator.geolocation){ showToast('Hindi supported ng browser mo ang location'); return; }
    findNear.textContent = 'Locating...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        state.userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        showToast('Nakita ang lokasyon mo');
        render();
      },
      () => { showToast('Hindi ma-access ang location, i-allow sa browser settings'); findNear.textContent = '📍 Find spots near me'; },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  const useMyLoc = document.getElementById('useMyLocation');
  if (useMyLoc) useMyLoc.onclick = () => {
    if (!navigator.geolocation){ showToast('Hindi supported ng browser mo ang location'); return; }
    useMyLoc.textContent = 'Locating...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        state.formPin = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        useMyLoc.textContent = '📍 Use my current location';
        initFormMap();
        showToast('Napin ang lokasyon mo, i-drag para i-adjust');
      },
      () => { showToast('Hindi ma-access ang location, i-allow sa browser settings'); useMyLoc.textContent = '📍 Use my current location'; },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  const submit = document.getElementById('fSubmit');
  if (submit) submit.onclick = submitListing;

  const cancelEdit = document.getElementById('cancelEdit');
  if (cancelEdit) cancelEdit.onclick = () => {
    state.editingListing = null;
    state.formPin = null;
    state.tab = 'search';
    render();
  };

  document.querySelectorAll('[data-edit-listing]').forEach(el => {
    el.onclick = () => {
      const listing = state.listings.find(l => l.id === el.dataset.editListing);
      if (!listing || !state.user || listing.user_id !== state.user.id) return;
      state.editingListing = listing;
      state.formPin = (listing.lat && listing.lng) ? { lat: listing.lat, lng: listing.lng } : null;
      state.tab = 'list';
      render();
    };
  });

  document.querySelectorAll('[data-delete-listing]').forEach(el => {
    el.onclick = async () => {
      const listing = state.listings.find(l => l.id === el.dataset.deleteListing);
      if (!listing || !state.user || listing.user_id !== state.user.id) return;
      if (!window.confirm('Sigurado ka bang gusto mo i-delete ang listing na ito?')) return;
      const ok = await deleteListingRow(listing.id);
      if (ok){
        state.listings = state.listings.filter(l => l.id !== listing.id);
        showToast('Na-delete ang listing');
        render();
      }
    };
  });

  const goLogin = document.getElementById('goLogin');
  if (goLogin) goLogin.onclick = () => openAuthModal();

  document.querySelectorAll('[data-cancel]').forEach(el => {
    el.onclick = async () => {
      const ok = await deleteBookingRow(el.dataset.cancel);
      if (ok){
        state.bookings = state.bookings.filter(b => b.id !== el.dataset.cancel);
        showToast('Cancelled');
        render();
      }
    };
  });

  document.querySelectorAll('[data-rate]').forEach(group => {
    group.querySelectorAll('[data-star]').forEach(star => {
      star.onclick = async () => {
        const bookingId = group.dataset.rate;
        const n = Number(star.dataset.star);
        const ok = await updateBookingRating(bookingId, n);
        if (ok){
          state.bookings = state.bookings.map(b => b.id === bookingId ? { ...b, rating: n } : b);
          showToast('Salamat sa rating!');
          render();
        }
      };
    });
  });

  document.querySelectorAll('[data-report]').forEach(el => {
    el.onclick = () => {
      const msg = window.prompt('Ano ang problema? (e.g. occupied ang spot, di makontak ang owner)');
      if (msg && msg.trim()){
        const reports = JSON.parse(localStorage.getItem('sirong_reports') || '[]');
        reports.push({ id: uid(), bookingId: el.dataset.report, message: msg.trim(), at: new Date().toISOString() });
        localStorage.setItem('sirong_reports', JSON.stringify(reports));
        showToast('Naisumite ang report, salamat');
      }
    };
  });
}

function submitListing(){
  if (!state.user){ showToast('Kailangan mag-login muna'); return; }
  const editing = state.editingListing;
  const owner = state.user.displayName;
  const address = document.getElementById('fAddress').value.trim();
  const price = Number(document.getElementById('fPrice').value);
  if (!address || !price) { showToast('Kumpletuhin ang address, price'); return; }
  if (!state.formPin) { showToast('I-pin muna ang lokasyon sa mapa'); return; }
  const features = Array.from(document.querySelectorAll('[data-formfeat].active')).map(el => el.dataset.formfeat);
  const notes = document.getElementById('fNotes').value.trim();
  const instant = document.getElementById('fInstant').checked;
  const fiesta = document.getElementById('fFiesta').checked;
  const payment = document.getElementById('fPayment').value;
  const sizeInfo = document.getElementById('fSize').value;
  const fileInput = document.getElementById('fPhoto');
  const files = fileInput && fileInput.files ? Array.from(fileInput.files).slice(0, 6) : [];
  const { lat, lng } = state.formPin;

  async function finish(photos){
    const hasNewPhotos = photos.length > 0;
    const fields = { address, price, features, notes, owner, instant, fiesta, payment, size_info: sizeInfo || null, lat, lng };
    if (hasNewPhotos) fields.photos = photos;

    if (editing){
      const updated = await updateListingRow(editing.id, fields);
      if (updated){
        state.listings = state.listings.map(l => l.id === editing.id ? updated : l);
        state.editingListing = null;
        state.formPin = null;
        showToast('Na-update ang listing');
        state.tab = 'search';
        render();
      }
    } else {
      const listing = { id: uid(), ...fields, user_id: state.user.id, photos: hasNewPhotos ? photos : null };
      const saved = await insertListing(listing);
      if (saved){
        state.listings = [saved, ...state.listings];
        state.formPin = null;
        showToast('Nakalista na ang space mo');
        state.tab = 'search';
        render();
      }
    }
  }

  if (files.length){
    showToast('Ino-optimize ang mga litrato...');
    Promise.all(files.map(f => resizeImage(f, 1280))).then(results => {
      finish(results.filter(Boolean));
    });
  } else {
    finish([]);
  }
}

  const name = state.user.displayName;

  const start = document.getElementById('bfStart').value;

  const hours = Math.max(1, Number(end.split(':')[0]) - Number(start.split(':')[0]));
  const booking = {
    id: uid(), listingId: state.bookingTarget.id, address: state.bookingTarget.address,
    renter: name, date, start, end, total: hours * state.bookingTarget.price, instant: state.bookingTarget.instant,
    userId: state.user.id,
  };
  const saved = await insertBooking(booking);
  if (saved){
    state.bookings = [saved, ...state.bookings];
    document.getElementById('overlay').classList.add('hidden');
    showToast(saved.instant ? 'Naka-book agad — instant confirm' : 'Booking request sent, hintayin approval');
    state.tab = 'bookings';
    render();
  }
};

document.getElementById('fiestaToggle').onclick = () => {
  state.fiestaMode = !state.fiestaMode;
  render();
};

document.querySelectorAll('.nav button').forEach(btn => {
  btn.onclick = () => {
    state.tab = btn.dataset.tab;
    if (btn.dataset.tab === 'list'){ state.editingListing = null; state.formPin = null; }
    render();
  };
});

function openAuthModal(){
  document.getElementById('authError').style.display = 'none';
  document.getElementById('authOverlay').classList.remove('hidden');
}
function closeAuthModal(){
  document.getElementById('authOverlay').classList.add('hidden');
}
function setAuthMode(mode){
  state.authMode = mode;
  document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignup').classList.toggle('active', mode === 'signup');
  document.getElementById('authNameField').style.display = mode === 'signup' ? 'block' : 'none';
  document.getElementById('authTitle').textContent = mode === 'signup' ? 'Gumawa ng account' : 'Log in';
  document.getElementById('authSubmit').textContent = mode === 'signup' ? 'Gumawa ng account' : 'Log in';
  document.getElementById('authError').style.display = 'none';
}

document.getElementById('authClose').onclick = closeAuthModal;
document.getElementById('tabLogin').onclick = () => setAuthMode('login');
document.getElementById('tabSignup').onclick = () => setAuthMode('signup');

document.getElementById('authSubmit').onclick = async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errorEl = document.getElementById('authError');
  errorEl.style.display = 'none';

  if (!email || !password){ errorEl.textContent = 'Kumpletuhin ang email at password'; errorEl.style.display = 'block'; return; }

  if (state.authMode === 'signup'){
    const displayName = document.getElementById('authName').value.trim();
    if (!displayName){ errorEl.textContent = 'Ilagay ang pangalan mo'; errorEl.style.display = 'block'; return; }
    const { user, error } = await signUp(email, password, displayName);
    if (error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }
    if (!user){ errorEl.textContent = 'Pakicheck ang email mo para i-confirm ang account, pagkatapos mag-login.'; errorEl.style.display = 'block'; return; }
    state.user = user;
  } else {
    const { user, error } = await signIn(email, password);
    if (error){ errorEl.textContent = error.message; errorEl.style.display = 'block'; return; }
    state.user = user;
  }

  closeAuthModal();
  showToast(`Hi, ${state.user.displayName}!`);

  if (state.pendingAction && state.pendingAction.type === 'book'){
    const listingId = state.pendingAction.listingId;
    state.pendingAction = null;
    render();
    openBooking(listingId);
  } else {
    render();
  }
};

async function init(){
  render();
  const { data: sessionData } = await sb.auth.getSession();
  state.user = sessionData && sessionData.session ? mapUser(sessionData.session.user) : null;
  sb.auth.onAuthStateChange((_event, session) => {
    state.user = session ? mapUser(session.user) : null;
    renderAccountRow();
  });
  const [listings, bookings] = await Promise.all([fetchListings(), fetchBookings()]);
  state.listings = listings;
  state.bookings = bookings;
  state.loading = false;
  render();
}
init();
</script>
</body>
</html>
